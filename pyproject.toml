[project]
name = "local-talking-llm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.0.0",
    "flask>=3.1.3",
    "langchain-ollama>=0.3.3",
    "langchain-openai>=0.3.0",
    "langchain>=0.3.25",
    "numpy>=1.26.0",
    "piper-tts>=1.6.0",
    # Declared explicitly: until now 19-10-2026 pydantic was only present as a transitive
    # dependency of langchain.
    # The Phase 1 contract models will depend on it directly.
    "pydantic>=2.11.5",
    "pyyaml>=6.0.2",
    "rich>=14.0.0",
    "scipy>=1.15.3",
    "setuptools>=80.9.0",
    "sounddevice>=0.5.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.3",
]

[tool.uv.extra-build-dependencies]
openai-whisper = ["setuptools"]
