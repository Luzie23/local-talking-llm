<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Klinisches Interview</title>

<!-- Schriften: Newsreader (serif, warm) für die Fragen, Instrument Sans für die UI -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Design -->
<link rel="stylesheet" href="style.css">

<!-- INHALTE: kommt aus der separaten Datei. Dein System ersetzt sie später. -->
<script src="conversation.js"></script>
</head>
<body>

<!-- =========================================================================
     GRUNDGERÜST DES FENSTERS
     Beide Modalitäts-Panels (Text & Sprache) sind vorhanden; das Skript
     unten zeigt je nach Einstellung nur EINES an.
     ========================================================================= -->
<div class="deskwin">

  <!-- START-OVERLAY: sichtbar bis "Interview starten" geklickt wird.
       Inhalte (Titel, Text, Checkliste) kommen aus conversation.js. -->
  <div class="startov" id="startov">
    <div class="startbox">
      <div class="starttitle" id="startTitle">Bereit fürs Interview?</div>
      <div class="startsub" id="startSub"></div>
      <ul class="startlist" id="startList"></ul>

      <div class="starttest">
        <button class="testbtn" id="testSoundBtn" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
          <span>Testton abspielen</span>
        </button>
        <button class="testbtn" id="testMicBtn" type="button">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/></svg>
          <span>Mikrofon testen</span>
        </button>
        <div class="miclevel" id="micLevelMeter">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>

      <button class="startbtn" id="startBtn" disabled>Wird vorbereitet …</button>
    </div>
  </div>

  <div class="deskbody">

    <!-- LINKS: Embodiment-Bühne (feste Größe). Inhalt füllt das Skript ein. -->
    <div class="stage">
      <div class="slot" id="slot"></div>
      <div class="slotmeta">
        <div class="slotname" id="clinicianName">—</div>
        <div class="slotrole" id="clinicianRole">—</div>
      </div>
    </div>

    <!-- RECHTS: Konversation. Der Chat wird in BEIDEN Modalitäten gezeigt.
         Unten je nach Modalität die passende Leiste. -->
    <div class="convo">
      <div class="chat" id="chat"><!-- Sprechblasen werden eingefügt --></div>

      <!-- Leiste A: TEXT-Modalität -->
      <div class="inputbar" id="inputbar">
        <input class="field" type="text" placeholder="Ihre Antwort eingeben …">
        <button class="send" aria-label="Senden">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/></svg>
        </button>
      </div>

      <!-- Leiste B: SPRACH-Modalität — Mikro per KLICK umschalten (kein Halten) -->
      <div class="micbar" id="micbar" style="display:none">
        <button class="mictoggle" id="micBtn">
          <span class="miccircle">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/></svg>
          </span>
          <span id="micLabel">Zum Sprechen klicken</span>
        </button>
      </div>
    </div>
  </div>

  <!-- FORSCHER-OVERLAY: mit  Cmd/Strg + Shift + R  ein-/ausblenden -->
  <div class="ovpanel hidden" id="overlay">
    <div class="ovhd"><span class="ovtitle">Forscher</span><span class="ovkbd">⌘/Strg ⇧ R</span></div>

    <!-- FAKTOR 1: Embodiment -->
    <div class="ovgroup">
      <div class="ovglabel">Embodiment</div>
      <div class="seg" id="embSeg">
        <button class="segbtn" data-emb="logo">Logo</button>
        <button class="segbtn" data-emb="picture">Bild</button>
        <button class="segbtn" data-emb="video">Video</button>
        <button class="segbtn" data-emb="avatar">Avatar</button>
      </div>
    </div>

    <!-- FAKTOR 2: Modalität -->
    <div class="ovgroup">
      <div class="ovglabel">Modalität</div>
      <div class="tog" id="modTog">
        <button class="togbtn" data-mod="text">Text</button>
        <button class="togbtn" data-mod="speech">Sprache</button>
      </div>
    </div>

    <!-- Transkript-Log (nur für Forschende) -->
    <div class="ovgroup">
      <div class="ovglabel">Transkript-Log</div>
      <div class="log" id="log"></div>
    </div>
  </div>
</div>

<!-- =========================================================================
     RENDER-LOGIK
     Liest window.CONVERSATION (aus conversation.js). Fehlt die Datei, wird der
     eingebaute Beispieltext genutzt, damit das Layout testbar bleibt.
     >>> Als Forscher musst du hier normalerweise NICHTS ändern – Inhalte und
         Bedingungen steuerst du über conversation.js bzw. das Overlay. <<<
     ========================================================================= -->
<script>
(function () {
  "use strict";

  /* --- Not-Beispieltext, falls conversation.js fehlt -------------------- */
  const FALLBACK = {
    clinicianName: "Dr. Maren Vos",
    clinicianRole: "Klinisches Interview · Aufnahme",
    embodiment: "picture", pictureSrc: "", videoSrc: "",
    modality: "text",
    clinicianTyping: true,
    clinicianSpeaking: false, userRecording: false, liveTranscript: "", spokenChars: null,
    startTitle: "Bereit fürs Interview?",
    startSubtitle: "Bitte prüfen Sie kurz, ob die folgenden Voraussetzungen erfüllt sind.",
    startButton: "Interview starten",
    startChecklist: [
      "Sie sitzen in einer ruhigen Umgebung und werden nicht gestört.",
      "Ton und Mikrofon Ihres Geräts funktionieren.",
    ],
    pendingOpeningMessage: "Danke, dass Sie sich heute Zeit nehmen. Wie würden Sie Ihre Stimmung in den letzten zwei Wochen beschreiben?",
    messages: [
      { role: "user",      text: "Ehrlich gesagt ziemlich flach." },
      { role: "clinician", text: "Das klingt belastend. Ist das die meiste Zeit des Tages da?" }
    ]
  };

  const cfg = window.CONVERSATION || FALLBACK;
  if (!window.CONVERSATION) {
    window.CONVERSATION = cfg;
  }

  /* --- Baut den Inhalt des Embodiment-Kastens je Bedingung -------------- */
  function embodimentHTML() {
    switch (cfg.embodiment) {
      case "logo":
        return '<div class="logofill"><div class="logoglyph"></div></div>';
      case "avatar":
        return '<div class="avatarfill"><div class="avhead"></div><div class="avbody"></div></div>';
      case "picture":
        return cfg.pictureSrc
          ? '<img class="fill embimg" src="' + cfg.pictureSrc + '" alt="Klinikerin">'
          : '<div class="ph"><span class="phlabel">Portrait</span></div>';
      case "video":
        var v = cfg.videoSrc
          ? '<video class="fill embimg" src="' + cfg.videoSrc + '" autoplay muted loop playsinline></video>'
          : '<div class="ph"><span class="phlabel">Video</span></div>';
        return v +
          '<div class="livebadge"><span class="livedot"></span>LIVE</div>' +
          '<div class="wave">' +
            '<span class="wbar" style="height:8px"></span><span class="wbar" style="height:18px;animation-delay:.1s"></span>' +
            '<span class="wbar" style="height:12px;animation-delay:.2s"></span><span class="wbar" style="height:22px;animation-delay:.15s"></span>' +
            '<span class="wbar" style="height:9px;animation-delay:.05s"></span></div>';
      default:
        return '<div class="ph"><span class="phlabel">?</span></div>';
    }
  }

  /* --- Zeichnet die gesamte Oberfläche neu ------------------------------ */
  function render() {
    // Kopf
    document.getElementById("clinicianName").textContent = cfg.clinicianName;
    document.getElementById("clinicianRole").textContent = cfg.clinicianRole;
    document.title =
      "Klinisches Interview · " + (cfg.modality === "speech" ? "Sprache" : "Text");

    // Embodiment
    document.getElementById("slot").innerHTML = embodimentHTML();

    // Modalität: passende Bodenleiste zeigen
    const isSpeech = cfg.modality === "speech";
    document.getElementById("inputbar").style.display = isSpeech ? "none" : "flex";
    document.getElementById("micbar").style.display   = isSpeech ? "flex" : "none";

    const chat = document.getElementById("chat");
    if (isSpeech) {
      renderSpeech(chat);
    } else {
      renderText(chat);
    }

    // Transkript-Log (immer – auch in der Sprach-Bedingung, nur für Forschende)
    const log = document.getElementById("log");
    log.innerHTML = cfg.messages.map(function (m) {
      const who = m.role === "user" ? "P01" : "LLM";
      return '<div class="logrow"><b>' + who + '</b> ' + m.text + '</div>';
    }).join("");

    // aktive Buttons im Overlay markieren
    document.querySelectorAll("#embSeg .segbtn").forEach(function (btn) {
      btn.classList.toggle("on", btn.dataset.emb === cfg.embodiment);
    });
    document.querySelectorAll("#modTog .togbtn").forEach(function (btn) {
      btn.classList.toggle("on", btn.dataset.mod === cfg.modality);
    });
  }

  /* --- Text-Modalität: normale Chat-Blasen ------------------------------- */
  function renderText(chat) {
    chat.innerHTML = "";
    cfg.messages.forEach(function (m) {
      const b = document.createElement("div");
      b.className = m.role === "user" ? "ba" : "bq";
      b.textContent = m.text;
      chat.appendChild(b);
    });
    if (cfg.clinicianTyping) {
      chat.insertAdjacentHTML("beforeend",
        '<div class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>');
    }
    chat.scrollTop = chat.scrollHeight;
  }

  /* --- Sprach-Modalität: KEIN Gesprächstext, nur Gesprächszustand --------
     Absichtlich kein Mitlesen mehr (Entscheidung nach Rücksprache) — die
     Sprach-Bedingung ist damit wirklich "nur Sprache", nicht "Sprache +
     versteckter Text". Was die teilnehmende Person sagt, bleibt als eigenes
     Live-Transkript sichtbar (.vtranscript) — das sind ihre eigenen Worte,
     nicht die des LLM, und es macht STT-Fehler direkt sichtbar.

     Nur EIN Zustands-Element wird je erzeugt und danach nur noch per Klasse
     umgeschaltet (nie neu aufgebaut) — dieselbe Lehre wie beim vorherigen
     turnId-Fix, nur diesmal von Anfang an richtig: weil hier nichts mehr
     live Zeichen für Zeichen mitgeschrieben wird, gibt es auch keinen
     Grund mehr, das Element je auszutauschen. */
  function renderSpeech(chat) {
    let state, label;
    if (cfg.userRecording) {
      state = "listening"; label = "Ich höre zu";
    } else if (cfg.clinicianSpeaking) {
      state = "speaking"; label = "… spricht";
    } else if (cfg.clinicianTyping || cfg.processingResponse) {
      state = "preparing"; label = "Antwort wird vorbereitet";
    } else {
      state = "ready"; label = "Sie können jetzt antworten.";
    }

    let vstate = chat.querySelector("#vstate");
    if (!vstate) {
      chat.innerHTML =
        '<div class="vstate" id="vstate">' +
          '<div class="vbars" id="vstateBars"><i></i><i></i><i></i><i></i></div>' +
          '<div class="vlabel" id="vstateLabel"></div>' +
        '</div>' +
        '<div class="vtranscript" id="vtranscript"></div>';
      vstate = chat.querySelector("#vstate");
    }
    document.getElementById("vstateBars").className = "vbars " + state;
    document.getElementById("vstateLabel").textContent = label;

    const transcriptEl = document.getElementById("vtranscript");
    if (cfg.userRecording && cfg.liveTranscript) {
      transcriptEl.classList.add("on");
      transcriptEl.textContent = cfg.liveTranscript;
      transcriptEl.insertAdjacentHTML("beforeend", '<span class="caret"></span>');
    } else {
      transcriptEl.classList.remove("on");
      transcriptEl.textContent = "";
    }

    // Mikro-Button-Zustand (Klick-Bedienung bleibt vorerst bestehen — das
    // automatische Öffnen ist ein eigener, noch folgender Schritt).
    const btn = document.getElementById("micBtn");
    if (btn) {
      btn.classList.toggle("rec", !!cfg.userRecording);
      const disabled = cfg.processingResponse || cfg.clinicianSpeaking;
      btn.disabled = disabled;
      btn.classList.toggle("disabled", disabled);
      btn.style.pointerEvents = disabled ? "none" : "auto";
      document.getElementById("micLabel").textContent = label;
    }

    chat.scrollTop = chat.scrollHeight;
  }

  /* --- Overlay-Bedienung (Forscher) ------------------------------------- */
  // Tastenkürzel zum Ein-/Ausblenden
  document.addEventListener("keydown", function (e) {
    if ((e.metaKey || e.ctrlKey) && e.shiftKey && (e.key === "R" || e.key === "r")) {
      e.preventDefault();
      document.getElementById("overlay").classList.toggle("hidden");
    }
  });
  // Embodiment / Modalität live umschalten (zum Testen der Bedingungen)
  document.getElementById("embSeg").addEventListener("click", function (e) {
    const b = e.target.closest("[data-emb]"); if (!b) return;
    cfg.embodiment = b.dataset.emb; render();
  });
  document.getElementById("modTog").addEventListener("click", function (e) {
    const b = e.target.closest("[data-mod]"); if (!b) return;
    cfg.modality = b.dataset.mod; render();
  });
  // Mikro per Klick umschalten (Sprach-Modalität, PC-tauglich).
  // >>> HIER hängst du deine Aufnahme an: bei Start MediaRecorder starten und den
  //     STT-Text laufend in cfg.liveTranscript schreiben + render(); bei Stopp die
  //     fertige Eingabe an dein Flask-Backend senden (analog sendChatMessage). <<<
  var micBtn = document.getElementById("micBtn");
  if (micBtn) micBtn.addEventListener("click", function () {
    if (cfg.processingResponse) {
      return;
    }
    cfg.userRecording = !cfg.userRecording;
    if (typeof window.onMicToggle === "function") window.onMicToggle(cfg.userRecording);
    render();
  });

  /* --- Testton: reine Web-Audio-Erzeugung, kein Server/TTS nötig --------- */
  function playTestTone() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = 440;
      gain.gain.setValueAtTime(0, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.25, ctx.currentTime + 0.06);
      gain.gain.linearRampToValueAtTime(0.25, ctx.currentTime + 0.5);
      gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.6);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.65);
      osc.onended = function () { ctx.close(); };
    } catch (err) {
      console.warn("Testton konnte nicht abgespielt werden.", err);
    }
  }

  /* --- Mikrofon-Test: zeigt eine echte Pegelanzeige, nimmt aber nichts auf,
         sendet nichts und speichert nichts — reines lokales Feedback. ----- */
  let micTestStream = null;
  let micTestContext = null;
  let micTestRafId = null;

  async function toggleMicTest() {
    if (micTestStream) {
      stopMicTest();
      return;
    }
    const btn = document.getElementById("testMicBtn");
    const meter = document.getElementById("micLevelMeter");
    try {
      micTestStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      micTestContext = new (window.AudioContext || window.webkitAudioContext)();
      const source = micTestContext.createMediaStreamSource(micTestStream);
      const analyser = micTestContext.createAnalyser();
      analyser.fftSize = 256;
      source.connect(analyser);
      const data = new Uint8Array(analyser.frequencyBinCount);

      if (btn) {
        btn.classList.add("active");
        btn.querySelector("span").textContent = "Mikrofon-Test stoppen";
      }
      if (meter) {
        meter.classList.add("on");
      }
      const bars = meter ? meter.querySelectorAll("span") : [];

      (function tick() {
        analyser.getByteTimeDomainData(data);
        let sumSquares = 0;
        for (let i = 0; i < data.length; i++) {
          const v = (data[i] - 128) / 128;
          sumSquares += v * v;
        }
        const rms = Math.sqrt(sumSquares / data.length);
        const level = Math.min(1, rms * 4); // normale Sprechlautstärke sichtbar ausschlagen lassen
        const litCount = Math.round(level * bars.length);
        bars.forEach(function (bar, i) {
          bar.classList.toggle("lit", i < litCount);
        });
        micTestRafId = requestAnimationFrame(tick);
      })();
    } catch (err) {
      console.warn("Mikrofon-Test fehlgeschlagen.", err);
      if (btn) {
        btn.querySelector("span").textContent = "Mikrofon nicht verfügbar";
      }
    }
  }

  function stopMicTest() {
    if (micTestRafId) {
      cancelAnimationFrame(micTestRafId);
      micTestRafId = null;
    }
    if (micTestStream) {
      micTestStream.getTracks().forEach(function (track) { track.stop(); });
      micTestStream = null;
    }
    if (micTestContext) {
      micTestContext.close();
      micTestContext = null;
    }
    const btn = document.getElementById("testMicBtn");
    const meter = document.getElementById("micLevelMeter");
    if (btn) {
      btn.classList.remove("active");
      btn.querySelector("span").textContent = "Mikrofon testen";
    }
    if (meter) {
      meter.classList.remove("on");
      meter.querySelectorAll("span").forEach(function (bar) { bar.classList.remove("lit"); });
    }
  }

  /* --- Start-Overlay: Checkliste befüllen, Button erst aktiv, sobald die
         Eröffnungsnachricht vom Server da ist (siehe loadInterviewStart()
         in conversation.js, das parallel im Hintergrund lädt). ----------- */
  function initStart() {
    const ov = document.getElementById("startov");
    if (!ov) return;

    document.getElementById("startTitle").textContent = cfg.startTitle || "Bereit fürs Interview?";
    document.getElementById("startSub").textContent = cfg.startSubtitle || "";

    const list = document.getElementById("startList");
    if (list && Array.isArray(cfg.startChecklist)) {
      list.innerHTML = cfg.startChecklist.map(function () {
        return '<li><span class="startcheck">' +
          '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>' +
          '</span><span></span></li>';
      }).join("");
      // Text per textContent gesetzt, nicht per String-Konkatenation — so
      // kann kein Inhalt aus conversation.js als HTML interpretiert werden.
      list.querySelectorAll("li > span:last-child").forEach(function (el, i) {
        el.textContent = cfg.startChecklist[i];
      });
    }

    const soundBtn = document.getElementById("testSoundBtn");
    if (soundBtn) {
      soundBtn.querySelector("span").textContent = cfg.startSoundTestLabel || "Testton abspielen";
      soundBtn.addEventListener("click", playTestTone);
    }
    const micTestBtn = document.getElementById("testMicBtn");
    if (micTestBtn) {
      micTestBtn.querySelector("span").textContent = cfg.startMicTestLabel || "Mikrofon testen";
      micTestBtn.addEventListener("click", toggleMicTest);
    }

    const btn = document.getElementById("startBtn");
    btn.textContent = cfg.startButton || "Interview starten";
    // Erst klickbar, sobald die Eröffnungsnachricht wirklich da ist (siehe
    // window.onOpeningMessageReady) — falls der Server schneller war als
    // dieses Skript hier, ist sie es unter Umständen schon jetzt.
    btn.disabled = !cfg.pendingOpeningMessage;

    btn.addEventListener("click", function () {
      if (btn.disabled) return;
      stopMicTest(); // Mikrofon freigeben, falls der Test noch lief
      ov.classList.add("hidden");
      playOpening(cfg.pendingOpeningMessage || "");
    });
  }

  /* --- Gibt die Eröffnungsnachricht Wort für Wort aus, so als würde das
         LLM sie gerade live generieren (gilt nur für DIESE eine Nachricht,
         nicht für spätere Antworten). --------------------------------- */
  function playOpening(text) {
    const words = text.split(" ").filter(function (w) { return w.length > 0; });
    cfg.messages = [{ role: "clinician", text: "" }];
    render();

    if (words.length === 0) {
      return;
    }

    let shown = 0;
    const timer = setInterval(function () {
      shown += 1;
      cfg.messages[0].text = words.slice(0, shown).join(" ");
      render();
      if (shown >= words.length) {
        clearInterval(timer);
      }
    }, 150);
  }

  // Vom Hintergrund-Fetch in conversation.js aufgerufen, sobald die
  // Eröffnungsnachricht angekommen ist (auch wenn das Overlay schon
  // sichtbar ist und noch auf den Klick gewartet wird).
  window.onOpeningMessageReady = function () {
    const btn = document.getElementById("startBtn");
    if (btn) {
      btn.disabled = false;
      btn.textContent = cfg.startButton || "Interview starten";
    }
  };

  window.render = render;
  window.setupTextInput = setupTextInput;

  setupTextInput();
  initStart();
  render();
})();
</script>
</body>
</html>
