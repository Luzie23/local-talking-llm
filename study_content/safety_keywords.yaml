# =============================================================================
# SICHERHEITS-STICHWÖRTER
# -----------------------------------------------------------------------------
# Einfache, bewusst simple Erkennung: Wenn eine der unten stehenden Phrasen in
# der ANTWORT DER TEILNEHMENDEN PERSON vorkommt (nicht in der LLM-Ausgabe!),
# wird ein ruhiger Hinweis mit Hilfsangeboten eingeblendet — das Interview
# läuft dabei ganz normal weiter, es wird NICHT unterbrochen oder gestoppt.
#
# WARUM SO EINFACH (Kleinbuchstaben-Teilstring-Suche, kein LLM, kein
# "Verstehen" von Kontext oder Verneinung)?
#   - Durchsichtig und für eine Ethikkommission genau nachvollziehbar: man
#     kann exakt sehen, was auslöst und was nicht — kein "Black Box"-Urteil.
#   - Das LLM soll hier bewusst NICHT selbst beurteilen, ob etwas
#     besorgniserregend ist — das wäre eine klinische Bewertung durch die KI,
#     genau das, was dieses System an keiner anderen Stelle tut.
#   - Nachteil, den man kennen sollte: erkennt keine Umschreibungen, schlägt
#     manchmal auch bei harmloser Erwähnung an (z. B. "ich habe darüber einen
#     Artikel gelesen") oder bei Verneinung ("früher, aber nicht mehr"). Das
#     ist so gewollt — lieber einmal zu oft ein Hilfsangebot zeigen als es
#     bei einem echten Fall zu verpassen.
#
# WICHTIGE LEKTION AUS DER PRAXIS (04.08., echter Testlauf): "nicht mehr da
# sein" hat NICHT auf "nicht mehr da ZU sein" angeschlagen — schon ein
# einzelnes eingeschobenes Wort reicht, um eine exakte Phrase zu verfehlen.
# Faustregel beim Ergänzen: LIEBER KÜRZERE, KERNIGE BRUCHSTÜCKE als ganze
# Sätze/Phrasen. Kürzere Fragmente überstehen eingeschobene Wörter, andere
# Satzstellung und Konjugation viel robuster. Der Preis dafür sind mehr
# harmlose Treffer — das ist hier ausdrücklich in Kauf genommen.
#
# GRAMMATIK PRO SPRACHE BEACHTEN: Die konkrete Bruchstelle unterscheidet sich
# je nach Sprache. Im Deutschen reißt die "zu"-Infinitiv-Form manche Verben
# auseinander ("mich umbringen" -> "umzubringen") — deshalb hier viele
# "...zu ..."-Varianten. Im Englischen gibt es diese Bruchstelle nicht, dafür
# eine andere: die Gerundium-Form ("hurt myself" matcht NICHT auf "hurting
# myself", genau dasselbe Prinzip, nur andere Grammatik). Beim Ergänzen einer
# neuen Sprache immer prüfen: An welcher Stelle bricht DORT eine exakte
# Phrase durch Verbformen/Wortstellung?
#
# QUELLEN: Diese Liste wurde ausgehend von zwei Fachpublikationen erweitert
# (s. study_content/safety_keywords_sources.md für vollständige Angaben und
# Begründung) — u. a. sind indirekte Formulierungen wie "wäre tot" und
# eng gefasste Methodik-Anfragen ("tödliche dosis" u. Ä.) direkt daraus
# übernommen, nicht nur eigene Vermutungen.
#
# SPRACHE: Eine eigene Liste PRO SPRACHE, passend zum "language"-Feld in
# study_settings.yaml (z. B. "de", "en"). Läuft die Studie z. B. auf
# Englisch, wird automatisch die "en"-Liste genutzt — eine rein deutsche
# Liste würde dort komplett wirkungslos bleiben. Fehlt eine Sprache hier
# ganz, wird sicherheitshalber über ALLE Sprachen zusammen gesucht (siehe
# backend/safety_check.py) — lieber zu breit suchen als gar nicht.
#
# Wörter/Phrasen pro Sprache frei ergänzen, entfernen oder anpassen.
# Kleinschreibung spielt keine Rolle (die Suche ignoriert Groß-/
# Kleinschreibung).
# =============================================================================

