# SKID-5-PD / SCID-5-PD — CHATBOT INTERVIEW GUIDE (GERMAN, UNOFFICIAL WORKING TRANSLATION)
# ==========================================================================================
# Source: First MB, Williams JBW, Benjamin LS, Spitzer RL: Structured Clinical
# Interview for DSM-5 Personality Disorders (SCID-5-PD). APA Publishing, 2016.
# Use in this chatbot is covered by the project's APA permission (confirmed by
# the project team on 25 Oct 2026).
#
# LANGUAGE: The German question wording below is an UNOFFICIAL WORKING
# TRANSLATION of the English edition made for this prototype. It is NOT the
# official German SKID-5-PD (Hogrefe) and MUST be reviewed by the project
# psychologist (Bastian Wenk) before use with participants.
# Criteria and rating anchors are kept in English (verbatim from the source);
# they are only given to the agents, never shown to participants.
#
# STRUCTURE (follows the SCID-5-PD page order):
#   * Overview for Assessment of Personality Disorders (p. 4) — open questions,
#     not rated. The demographic "General Overview" (p. 2–3) is left out by
#     project decision.
#   * 10 disorders in SCID order + Other Specified Personality Disorder.
#   * One item per numbered SCID interview question ("id: Q<n>" = SCID
#     question number). Where several questions belong to one criterion they
#     share criterion_id / criterion_code; each is asked and rated separately
#     and the clinician combines them.
#   * The SCID-5-SPQ screening questionnaire is not used, so the question
#     wording follows the bracketed variant for "SPQ not completed".
#   * Bold follow-up questions from the source are listed under "probes" —
#     the Question Agent uses them as material for its (one) clarification.
#
# ITEMS THAT ARE NOT ASKED BY THE CHATBOT (ask: false; recorded as
# "not assessed by chatbot – clinician rating required"):
#   observation   – "OBSERVED DURING INTERVIEW" items (not possible in text chat)
#   clinician     – Criterion B exclusion items whose questions are only asked
#                   "IF THERE IS EVIDENCE OF" a psychotic disorder / substance use /
#                   medical condition (needs clinical information); age criterion
#   derived       – ratings the source derives from other items
#   same_as       – source says "previously rated in …"; not asked again
#
# SOURCE-DEFINED ROUTING EXECUTED BY THE APPLICATION:
#   * Antisocial PD, Criterion C gate: "AT LEAST TWO CONDUCT DISORDER CRITERIA
#     (C1–C15) ARE RATED 2" — YES: continue with the adult criteria A;
#     NO: go to Other Specified PD. Uses the PROVISIONAL chatbot ratings
#     ("?" counts as not "2"); logged in the session record.
#   * "IF CAN'T ANSWER, MOVE ON" (overview question) — cannot_answer_moves_on.
# Per-disorder diagnostic thresholds ("AT LEAST N CRITERIA ARE RATED 2") are
# NOT executed: no diagnoses are produced.
#
# RATING (source-defined): ? = inadequate information, 0 = absent,
# 1 = subthreshold, 2 = threshold. Chatbot ratings are provisional and for
# clinician review only.

guide_id: scid5pd_de
title: "SKID-5-PD (German, unofficial working translation) – all PD modules"
content_source: "SCID-5-PD (APA 2016), permission confirmed by project; German = UNOFFICIAL working translation, pending review by project psychologist"
behavior_profile: strict_clinical
guide_version: "1.0-draft"
language: de
interview_type: structured
navigation_mode: scid_flow
default_max_clarifications: 1
rating_scheme: scid5pd

# General PD criteria to consider for a rating of "2" (SCID-5-PD p. 5–6),
# given to the Judgment Agent for every rated item.
rating_guidance: >
  A rating of "2" (threshold) requires that the trait is (A) at the extreme end
  of the continuum compared with the person's culture, (B) pervasive across many
  situations and people, not restricted to a single relationship, situation or
  role, (C) has a negative impact on social interactions, close relationships or
  functioning at work/school/home, and (D) has been frequently present over at
  least the last 5 years with evidence going back to the late teens or early 20s;
  (E/F) it is not better explained by another mental disorder, substance use or
  a medical condition. Use "1" (subthreshold) when the trait is described but
  these requirements or the item's rating anchor are not clearly met, "0" when
  the participant clearly denies it, "?" when the information is inadequate.

framing_message: >
  Guten Tag und vielen Dank, dass Sie sich Zeit nehmen. Ich bin ein
  KI-gestütztes System und werde Ihnen im Rahmen dieser Studie Fragen aus einem
  strukturierten Interview stellen. Es gibt keine richtigen oder falschen
  Antworten. Sie können jede Frage überspringen, indem Sie zum Beispiel
  „überspringen“ schreiben, und jederzeit nachfragen, wenn etwas unklar ist.
  Das Interview ersetzt keine fachliche Untersuchung.

closing_message: >
  Vielen Dank, das war bereits die letzte Frage. Das Interview ist damit
  abgeschlossen. Ihre Antworten werden von einer Fachperson der Studie
  ausgewertet.

sections:
  # ---------------------------------------------------------------- p. 4
  - section_title: "Überblick zur Erfassung von Persönlichkeitsstörungen"
    questions:
      - id: OV1
        rating_scheme: none
        criterion_id: OVERVIEW
        criterion: "Open overview question (not rated): how the participant describes themselves as a person - how they generally feel or behave. Any self-description is sufficient."
        intro: "Ich möchte Ihnen jetzt einige Fragen dazu stellen, was für ein Mensch Sie sind – das heißt, wie Sie sich im Allgemeinen fühlen oder verhalten."
        text: "Wie würden Sie sich selbst als Person beschreiben?"
        cannot_answer_moves_on: true   # source: "IF CAN'T ANSWER, MOVE ON"
      - id: OV2
        rating_scheme: none
        criterion_id: OVERVIEW
        criterion: "Open overview question (not rated): how the participant thinks other people would describe them."
        text: "Wie würden andere Menschen Sie als Person beschreiben?"
      - id: OV3
        rating_scheme: none
        criterion_id: OVERVIEW
        criterion: "Open overview question (not rated): who the important people in the participant's life have been."
        text: "Wer waren die wichtigen Menschen in Ihrem Leben?"
        probes: ["(Falls nur Familie genannt wird:) Wie ist es mit Freundinnen und Freunden?"]
      - id: OV4
        rating_scheme: none
        criterion_id: OVERVIEW
        criterion: "Open overview question (not rated): how the participant has gotten along with these important people."
        text: "Wie sind Sie mit diesen Menschen ausgekommen?"
      - id: OV5
        rating_scheme: none
        criterion_id: OVERVIEW
        criterion: "Open overview question (not rated): whether the participant's usual way of reacting or behaving with people has caused problems with anyone (at home, school, work) and in what way."
        text: "Glauben Sie, dass die Art, wie Sie normalerweise auf Dinge reagieren oder sich anderen gegenüber verhalten, Ihnen mit irgendjemandem Probleme bereitet hat?"
        probes: ["(Zu Hause? In der Schule? Bei der Arbeit?)", "(Auf welche Weise?)"]
      - id: OV6
        rating_scheme: none
        criterion_id: OVERVIEW
        criterion: "Open overview question (not rated): how successful the participant considers themselves at getting what they want in life (satisfying relationship, fulfilling career, close friends)."
        text: "Wie erfolgreich sind Sie Ihrer Meinung nach darin, das zu bekommen, was Sie sich im Leben wünschen – zum Beispiel eine erfüllende Beziehung, einen erfüllenden Beruf oder enge Freundschaften?"
      - id: OV7
        rating_scheme: none
        criterion_id: OVERVIEW
        criterion: "Open overview question (not rated): how the participant spends their free time."
        text: "Wie verbringen Sie Ihre Freizeit?"
      - id: OV8
        rating_scheme: none
        criterion_id: OVERVIEW
        criterion: "Open overview question (not rated): with whom the participant spends their free time."
        text: "Mit wem verbringen Sie Ihre Freizeit?"
      - id: OV9
        rating_scheme: none
        criterion_id: OVERVIEW
        criterion: "Open overview question (not rated): how the participant would want to be different if they could change their personality."
        text: "Wenn Sie Ihre Persönlichkeit in mancher Hinsicht verändern könnten – wie wären Sie dann gerne anders?"

  # ---------------------------------------------------------------- p. 7–8
  - section_title: "Vermeidend-selbstunsichere Persönlichkeitsstörung"
    questions:
      - id: Q1
        criterion_id: AVD_A1
        criterion_code: PD1
        intro: "Ich möchte Ihnen jetzt einige genauere Fragen stellen."
        text: "Haben Sie Arbeitsstellen oder Aufgaben gemieden, bei denen Sie mit vielen Menschen zu tun gehabt hätten?"
        probes:
          - "Nennen Sie mir bitte einige Beispiele."
          - "Was war der Grund, dass Sie diese Stellen oder Aufgaben gemieden haben? (Liegt es daran, dass Sie einfach nicht gern unter Menschen sind, oder daran, dass Sie Angst haben, kritisiert oder abgelehnt zu werden?)"
        criterion: "Avoids occupational activities that involve significant interpersonal contact because of fears of criticism, disapproval, or rejection."
        rating_anchor: "2 = at least two examples"
      - id: Q2
        criterion_id: AVD_A2
        criterion_code: PD2
        text: "Vermeiden Sie es, sich mit Menschen anzufreunden, wenn Sie nicht sicher sind, dass diese Sie mögen?"
        probes:
          - "Vermeiden Sie es, bei Gruppenaktivitäten mitzumachen, wenn Sie nicht sicher sind, dass Sie willkommen und akzeptiert sind?"
          - "Wenn Sie nicht wissen, ob jemand Sie mag – würden Sie dann jemals den ersten Schritt machen?"
        criterion: "Is unwilling to get involved with people unless certain of being liked."
        rating_anchor: "2 = almost never takes the initiative in becoming involved in a social relationship"
      - id: Q3
        criterion_id: AVD_A3
        criterion_code: PD3
        text: "Fällt es Ihnen schwer, sich selbst Menschen gegenüber zu „öffnen“, die Ihnen nahestehen?"
        probes: ["Woran liegt das? (Haben Sie Angst, ausgelacht zu werden oder sich zu blamieren?)"]
        criterion: "Shows restraint within intimate relationships because of the fear of being shamed or ridiculed."
        rating_anchor: "2 = true for almost all relationships"
      - id: Q4
        criterion_id: AVD_A4
        criterion_code: PD4
        text: "Machen Sie sich oft Sorgen, in sozialen Situationen kritisiert oder abgelehnt zu werden?"
        probes: ["Nennen Sie mir bitte einige Beispiele.", "Verbringen Sie viel Zeit damit, sich darüber Sorgen zu machen?"]
        criterion: "Is preoccupied with being criticized or rejected in social situations."
        rating_anchor: "2 = a lot of time spent worrying about social situations"
      - id: Q5
        criterion_id: AVD_A5
        criterion_code: PD5
        text: "Sind Sie normalerweise still, wenn Sie neue Menschen kennenlernen?"
        probes: ["Woran liegt das?", "(Liegt es daran, dass Sie sich in gewisser Weise unzulänglich oder nicht gut genug fühlen?)"]
        criterion: "Is inhibited in new interpersonal situations because of feelings of inadequacy."
        rating_anchor: "2 = acknowledges trait and many examples"
      - id: Q6
        criterion_id: AVD_A6
        criterion_code: PD6
        text: "Glauben Sie, dass Sie nicht so gut, so klug oder so attraktiv sind wie die meisten anderen Menschen?"
        probes: ["Erzählen Sie mir bitte davon."]
        criterion: "Views self as socially inept, personally unappealing, or inferior to others."
        rating_anchor: "2 = acknowledges belief"
      - id: Q7
        criterion_id: AVD_A7
        criterion_code: PD7
        text: "Haben Sie Angst davor, Dinge zu tun, die eine Herausforderung sein könnten, oder etwas Neues auszuprobieren?"
        probes: ["Liegt das daran, dass Sie Angst haben, sich zu blamieren?", "Nennen Sie mir bitte einige Beispiele."]
        criterion: "Is unusually reluctant to take personal risks or to engage in any new activities because they may prove embarrassing."
        rating_anchor: "2 = several examples of avoiding activities because of fear of embarrassment"

  # ---------------------------------------------------------------- p. 9–11
  - section_title: "Dependente Persönlichkeitsstörung"
    questions:
      - id: Q8
        criterion_id: DEP_1
        criterion_code: PD9
        text: "Fällt es Ihnen schwer, alltägliche Entscheidungen zu treffen – zum Beispiel, was Sie anziehen oder im Restaurant bestellen –, ohne sich Rat und Bestätigung von anderen zu holen?"
        probes: ["Können Sie mir einige Beispiele für Entscheidungen nennen, bei denen Sie um Rat oder Bestätigung bitten würden?", "(Passiert das meistens?)"]
        criterion: "Has difficulty making everyday decisions without an excessive amount of advice and reassurance from others."
        rating_anchor: "2 = several examples"
      - id: Q9
        criterion_id: DEP_2
        criterion_code: PD10
        text: "Sind Sie darauf angewiesen, dass andere Menschen sich um wichtige Bereiche Ihres Lebens kümmern, zum Beispiel um Finanzen, Kinderbetreuung oder Ihre Wohnsituation?"
        probes: ["Nennen Sie mir bitte einige Beispiele. (Ist das mehr, als sich nur Rat von anderen zu holen?)", "(War das bei den MEISTEN wichtigen Bereichen Ihres Lebens so?)"]
        criterion: "Needs others to assume responsibility for most major areas of his or her life. [Note: Do not include merely getting advice from others or subculturally expected behavior.]"
        rating_anchor: "2 = several examples"
      - id: Q10
        criterion_id: DEP_3
        criterion_code: PD11
        text: "Fällt es Ihnen schwer, anderen zu widersprechen, selbst wenn Sie glauben, dass diese im Unrecht sind?"
        probes: ["Nennen Sie mir bitte einige Beispiele, wann das vorgekommen ist.", "Was befürchten Sie, könnte passieren, wenn Sie widersprechen?"]
        criterion: "Has difficulty expressing disagreement with others because of fear of loss of support or approval. (Note: Do not include realistic fears of retribution.)"
        rating_anchor: "2 = acknowledges trait or several examples"
      - id: Q11
        criterion_id: DEP_4
        criterion_code: PD12
        text: "Fällt es Ihnen schwer, Projekte zu beginnen oder Dinge allein zu tun?"
        probes: ["Nennen Sie mir bitte einige Beispiele.", "Woran liegt das? (Liegt es daran, dass Sie nicht sicher sind, ob Sie es richtig machen können?)", "(Können Sie es, solange jemand da ist, der Ihnen hilft?)"]
        criterion: "Has difficulty initiating projects or doing things on his or her own (because of a lack of self-confidence in judgment or abilities rather than a lack of motivation or energy)."
        rating_anchor: "2 = acknowledges trait"
      - id: Q12
        criterion_id: DEP_5
        criterion_code: PD13
        text: "Ist es Ihnen so wichtig, dass andere sich um Sie kümmern, dass Sie bereit sind, unangenehme oder unzumutbare Dinge für sie zu tun?"
        probes: ["Nennen Sie mir bitte einige Beispiele für solche Dinge."]
        criterion: "Goes to excessive lengths to obtain nurturance and support from others, to the point of volunteering to do things that are unpleasant. [Note: Do not include behavior intended to achieve goals other than being liked, such as job advancement.]"
        rating_anchor: "2 = acknowledges trait and at least one example"
      - id: Q13
        criterion_id: DEP_6
        criterion_code: PD14
        text: "Fühlen Sie sich normalerweise unwohl, wenn Sie allein sind?"
        probes: ["Woran liegt das? (Liegt es daran, dass Sie jemanden brauchen, der sich um Sie kümmert?)"]
        criterion: "Feels uncomfortable or helpless when alone because of exaggerated fears of being unable to care for himself or herself."
        rating_anchor: "2 = acknowledges trait"
      - id: Q14
        criterion_id: DEP_7
        criterion_code: PD15
        text: "Haben Sie, wenn eine enge Beziehung endet, das Gefühl, sofort jemand anderen finden zu müssen, der sich um Sie kümmert?"
        probes: ["Erzählen Sie mir bitte davon.", "(Haben Sie meistens so reagiert, wenn enge Beziehungen zu Ende gegangen sind?)"]
        criterion: "Urgently seeks another relationship as a source of care and support when a close relationship ends."
        rating_anchor: "2 = happens when most close relationships end"
      - id: Q15
        criterion_id: DEP_8
        criterion_code: PD16
        text: "Machen Sie sich viele Sorgen, dass Sie allein gelassen werden und für sich selbst sorgen müssen?"
        probes: ["Weshalb glauben Sie, dass Sie allein gelassen werden und für sich selbst sorgen müssen? (Wie realistisch ist diese Befürchtung?)", "Wie sehr machen Sie sich darüber Sorgen?"]
        criterion: "Is unrealistically preoccupied with fears of being left to take care of himself or herself."
        rating_anchor: "2 = worry is excessive and unrealistic"

  # ---------------------------------------------------------------- p. 12–14
  - section_title: "Zwanghafte Persönlichkeitsstörung"
    questions:
      - id: Q16
        criterion_id: OCPD_1
        criterion_code: PD18
        text: "Sind Sie ein Mensch, der viel Zeit damit verbringt, sich auf Details, Ordnung oder Organisation zu konzentrieren oder Listen und Zeitpläne zu erstellen?"
        probes: ["Erzählen Sie mir bitte davon.", "Verbringen Sie so viel Zeit damit, dass der eigentliche Zweck dessen, was Sie tun wollten, verloren geht? (Zum Beispiel, dass Sie so lange eine Liste der zu erledigenden Dinge schreiben, dass Ihnen keine Zeit mehr bleibt, sie zu erledigen.)"]
        criterion: "Is preoccupied with details, rules, lists, order, organization, or schedules to the extent that the major point of the activity is lost."
        rating_anchor: "2 = acknowledges trait and at least one example"
      - id: Q17
        criterion_id: OCPD_2
        criterion_code: PD19
        text: "Haben Sie Schwierigkeiten, Dinge fertigzustellen, weil Sie so viel Zeit damit verbringen, sie genau richtig zu machen?"
        probes: ["Nennen Sie mir bitte einige Beispiele.", "(Wie oft kommt das vor?)"]
        criterion: "Shows perfectionism that interferes with task completion (e.g., is unable to complete a project because his or her own overly strict standards are not met)."
        rating_anchor: "2 = several examples of tasks not completed or significantly delayed because of perfectionism"
      - id: Q18
        criterion_id: OCPD_3
        criterion_code: PD20
        text: "Sind Sie Ihrer Arbeit oder dem Produktivsein sehr stark verschrieben?"
        probes: ["Sind Sie so sehr darauf ausgerichtet, dass Sie selten Zeit mit Freunden verbringen, in den Urlaub fahren oder Dinge einfach nur zum Spaß tun?", "(Wenn Sie sich freinehmen, nehmen Sie dann immer Arbeit mit, weil Sie es nicht ertragen, „Zeit zu verschwenden“?)"]
        criterion: "Is excessively devoted to work and productivity to the exclusion of leisure activities and friendships (not accounted for by obvious economic necessity). [Note: Also not accounted for by temporary job requirements.]"
        rating_anchor: "2 = acknowledges trait or has been told by other people"
      - id: Q19
        criterion_id: OCPD_4
        criterion_code: PD21
        text: "Haben Sie sehr hohe Maßstäbe dafür, was richtig und was falsch ist?"
        probes: ["Nennen Sie mir bitte einige Beispiele für Ihre hohen Maßstäbe.", "(Halten Sie sich buchstabengetreu an Regeln, ganz gleich, was passiert? Bestehen Sie darauf, dass sich auch andere an die Regeln halten?)", "(Falls ein religiöses Beispiel genannt wird:) Sind Sie strenger als andere Menschen, die Ihre religiösen Ansichten teilen?"]
        criterion: "Is overconscientious, scrupulous, and inflexible about matters of morality, ethics, or values (not accounted for by cultural or religious identification)."
        rating_anchor: "2 = several examples of holding self or others to rigidly high moral standards"
      - id: Q20
        criterion_id: OCPD_5
        criterion_code: PD22
        text: "Fällt es Ihnen schwer, Dinge wegzuwerfen, weil sie eines Tages nützlich sein könnten?"
        probes: ["Nennen Sie mir bitte einige Beispiele für Dinge, die Sie nicht wegwerfen können. (Wie ist es mit Dingen, die abgenutzt oder wertlos sind?)"]
        criterion: "Is unable to discard worn-out or worthless objects even when they have no sentimental value."
        rating_anchor: "2 = several examples of worn-out or worthless objects"
      - id: Q21
        criterion_id: OCPD_6
        criterion_code: PD23
        text: "Fällt es Ihnen schwer, mit anderen zusammenzuarbeiten oder andere um etwas zu bitten, wenn diese nicht bereit sind, die Dinge genau so zu machen, wie Sie es wollen?"
        probes: ["Erzählen Sie mir bitte davon. (Kommt das oft vor?)", "(Erledigen Sie Dinge oft am Ende selbst, um sicherzugehen, dass sie richtig gemacht werden?)"]
        criterion: "Is reluctant to delegate tasks or to work with others unless they submit to exactly his or her way of doing things."
        rating_anchor: "2 = acknowledges trait and at least one example"
      - id: Q22
        criterion_id: OCPD_7
        criterion_code: PD24
        text: "Fällt es Ihnen schwer, Geld für sich selbst und für andere Menschen auszugeben?"
        probes: ["Warum? (Liegt es daran, dass Sie sich Sorgen machen, in Zukunft nicht genug zu haben, wenn Sie es wirklich brauchen? Wofür könnten Sie es brauchen?)", "Hat jemand gesagt, Sie seien „geizig“ oder „knauserig“?"]
        criterion: "Adopts a miserly spending style toward both self and others; money is viewed as something to be hoarded for future catastrophes."
        rating_anchor: "2 = acknowledges trait and at least one example"
      - id: Q23
        criterion_id: OCPD_8
        criterion_code: PD25
        text: "Fällt es Ihnen schwer, Änderungen vorzunehmen, wenn Sie einmal Pläne gemacht haben?"
        probes: ["Erzählen Sie mir bitte davon.", "(Ist es Ihnen so wichtig, die Dinge auf die eine „richtige“ Art zu erledigen, dass es Ihnen schwerfällt, sich auf die Ideen anderer einzulassen?)"]
        criterion: "Shows rigidity and stubbornness."
        rating_anchor: "2 = acknowledges trait or has been told by other people"
      - id: Q24
        criterion_id: OCPD_8
        criterion_code: PD25
        text: "Haben andere Menschen gesagt, dass Sie stur sind?"
        probes: ["Erzählen Sie mir bitte davon."]
        criterion: "Shows rigidity and stubbornness."
        rating_anchor: "2 = acknowledges trait or has been told by other people"

  # ---------------------------------------------------------------- p. 15–17
  - section_title: "Paranoide Persönlichkeitsstörung"
    questions:
      - id: Q25
        criterion_id: PAR_A1
        criterion_code: PD27
        text: "Haben Sie oft das Gefühl, dass Menschen Sie ausnutzen, Ihnen schaden oder Sie belügen?"
        probes: ["Was lässt Sie das denken?"]
        criterion: "Suspects, without sufficient basis, that others are exploiting, harming, or deceiving him or her."
        rating_anchor: "2 = acknowledges trait and at least one example"
      - id: Q26
        criterion_id: PAR_A2
        criterion_code: PD28
        text: "Sind Sie ein sehr verschlossener Mensch, der sich anderen selten anvertraut?"
        probes: ["Liegt es daran, dass Sie Ihren Freunden oder den Menschen, mit denen Sie arbeiten, nicht vertrauen? Warum vertrauen Sie ihnen nicht?", "Verbringen Sie viel Zeit damit, darüber nachzudenken?"]
        criterion: "Is preoccupied with unjustified doubts about the loyalty or trustworthiness of friends or associates."
        rating_anchor: "2 = acknowledges preoccupation with trustworthiness or loyalty of other people"
      - id: Q27
        criterion_id: PAR_A3
        criterion_code: PD29
        text: "Finden Sie, dass es am besten ist, andere Menschen nicht viel über sich wissen zu lassen, weil sie es gegen Sie verwenden werden?"
        probes: ["Wann ist das passiert?", "Erzählen Sie mir bitte davon."]
        criterion: "Is reluctant to confide in others because of unwarranted fear that the information will be used maliciously against him or her."
        rating_anchor: "2 = acknowledges trait"
      - id: Q28
        criterion_id: PAR_A4
        criterion_code: PD30
        text: "Haben Sie oft das Gefühl, dass Menschen Sie mit dem, was sie sagen oder tun, bedrohen oder beleidigen?"
        probes: ["Erzählen Sie mir bitte davon."]
        criterion: "Reads hidden demeaning or threatening meanings into benign remarks or events."
        rating_anchor: "2 = acknowledges trait and at least one example of misinterpreting a benign remark or action"
      - id: Q29
        criterion_id: PAR_A5
        criterion_code: PD31
        text: "Sind Sie ein Mensch, der nachtragend ist oder lange braucht, um Menschen zu verzeihen, die Sie beleidigt oder herabgesetzt haben?"
        probes: ["Erzählen Sie mir bitte davon."]
        criterion: "Persistently bears grudges (i.e., is unforgiving of insults, injuries, or slights)."
        rating_anchor: "2 = acknowledges trait and at least one example"
      - id: Q30
        criterion_id: PAR_A5
        criterion_code: PD31
        text: "Gibt es viele Menschen, denen Sie nicht verzeihen können, weil sie vor langer Zeit etwas getan oder gesagt haben?"
        probes: ["Erzählen Sie mir bitte davon."]
        criterion: "Persistently bears grudges (i.e., is unforgiving of insults, injuries, or slights)."
        rating_anchor: "2 = acknowledges trait and at least one example"
      - id: Q31
        criterion_id: PAR_A6
        criterion_code: PD32
        text: "Werden Sie oft wütend oder gehen zum Gegenangriff über, wenn jemand Sie auf irgendeine Weise kritisiert oder beleidigt?"
        probes: ["Nennen Sie mir bitte einige Beispiele.", "(Sagen andere, dass Sie oft zu schnell gekränkt sind?)"]
        criterion: "Perceives attacks on his or her character or reputation that are not apparent to others and is quick to react angrily or to counterattack."
        rating_anchor: "2 = acknowledges trait and at least one example"
      - id: Q32
        criterion_id: PAR_A7
        criterion_code: PD33
        text: "Haben Sie schon einmal vermutet, dass Ihre Ehe- oder Lebenspartnerin bzw. Ihr Ehe- oder Lebenspartner Ihnen untreu war?"
        probes: ["Erzählen Sie mir bitte davon.", "(Welche Anhaltspunkte hatten Sie? Was haben Sie deswegen unternommen? Hatten Sie recht?)"]
        criterion: "Has recurrent suspicions, without justification, regarding fidelity of spouse or sexual partner."
        rating_anchor: "2 = examples of unjustified suspicions with several partners or on several occasions with the same partner OR acknowledges trait"
      - id: PAR_B
        ask: false
        not_asked_reason: clinician
        criterion_id: PAR_B
        criterion_code: PD35
